<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f7fa;
            color: #333;
        }
        header {
            background: #2563eb;
            color: white;
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .nav-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 24px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .banner {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        .banner h1 {
            font-size: 2.8rem;
            margin-bottom: 16px;
        }
        .banner p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .banner button {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #2563eb;
            font-size: 1rem;
            cursor: pointer;
        }
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 60px auto;
        }
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 40px;
        }
        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: 0.25s;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        .card h3 {
            margin-bottom: 12px;
            color: #2563eb;
        }
        footer {
            background: #1e293b;
            color: #aaa;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }
        @media(max-width:600px){
            .nav-wrap {
                flex-direction: column;
                gap:12px;
            }
            nav a {
                margin:0 10px;
            }
            .banner h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-wrap">
            <div class="logo">MyHome</div>
            <nav>
                <a href="#home">首页</a>
                <a href="#about">关于</a>
                <a href="#service">服务</a>
                <a href="#contact">联系</a>
            </nav>
        </div>
    </header>

    <section class="banner" id="home">
        <h1>欢迎来到我的主页</h1>
        <p>这是一个纯HTML+CSS制作的响应式主页，手机电脑都可以正常浏览。</p>
        <button onclick="alert('欢迎！')">了解更多</button>
    </section>

    <div class="container" id="service">
        <h2 class="section-title">功能卡片</h2>
        <div class="card-list">
            <div class="card">
                <h3>简洁美观</h3>
                <p>好久没用python了。</p>
                <div>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="about">
        <h2 class="section-title">关于我</h2>
        <div style="background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08)">
            <p>GitHub换到新的用户去了也是写个小项目玩玩。</p>
        </div>
    </div>

    <div class="container" id="contact">
        <h2 class="section-title">联系我</h2>
        <div style="background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08)">
            <p>邮箱：liuGrapeDevelop@outlook.com</p>
            <p>GitHub：github.com/liuGrape</p>
        </div>
    </div>

    <footer>
        <p>© 2026 liuGrape 版权所有</p>
    </footer>
</body>
</html>
